<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jaida Tarlit Assignment 1</title>
    <style>
      html {
        margin: 40px;
        font-family: sans-serif;
      }
      h1 {
        text-align: center;
      }
      .btn-container {
        box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.15);
        border-radius: 5px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 0.25rem 2rem 2em 2rem;
      }
      .btn {
        height: 40px;
        border: none;
        padding: 10px;
        border-radius: 3px;
        cursor: pointer;

        &.btn--primary {
          background-color: rgb(160, 237, 237);

          &:hover {
            background-color: rgb(200, 241, 241);
          }
        }

        &.btn--secondary {
          background-color: rgb(239, 205, 247);

          &:hover {
            background-color: rgb(247, 227, 251);
          }
        }

        &.btn--tertiary {
          background-color: transparent;
          border: solid 1px rgba(65, 65, 65, 0.552);

          &:hover {
            background-color: rgba(236, 236, 236, 0.274);
          }
        }

        &.btn--disabled {
          background-color: rgba(194, 194, 194);
          opacity: 0.5;
          cursor: not-allowed;
        }
      }
    </style>
  </head>
  <body>
    <h1>Jaida Tarlit Assignment 1</h1>

    <div class="btn-container">
      <div>
        <h2>Default</h2>
        <button class="btn btn--default">Default</button>
      </div>

      <div>
        <h2>Colour Change</h2>
        <button class="btn btn--primary">Primary</button>
      </div>

      <div>
        <h2>Colour Change</h2>
        <button class="btn btn--secondary">Secondary</button>
      </div>

      <div>
        <h2>Transparent</h2>
        <button class="btn btn--tertiary">Tertiary</button>
      </div>

      <div>
        <h2>Disabled</h2>
        <button class="btn btn--disabled">Disabled</button>
      </div>
    </div>
  </body>
</html>
